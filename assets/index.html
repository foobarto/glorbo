<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glorbo — Agent Orchestration for the Discerning Director</title>
  <meta name="description" content="Self-hosted, filesystem-first AI agent orchestration. Everything is markdown. Everything is a file. Run agents inside bwrap sandboxes on your own machine.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #0a0d0b; min-height: 100vh; }
    body {
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      color: #c9d9cd;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { width: 100%; max-width: 1200px; margin: 0 auto; }
    #__loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0d0b; color: #7a8c80;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      #root > div[data-root="true"] { padding: 16px 18px 32px !important; }
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="__loading">▚ glorbo — loading…</div></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ---------- shared small bits -----------------------------------------

    function Kbd({ children }) {
      return (
        <span style={{
          padding: "1px 6px",
          border: "1px solid #2a3a32",
          borderRadius: 3,
          color: "#c9d9cd",
          background: "#0a0d0b",
          fontSize: 11,
        }}>{children}</span>
      );
    }

    function TuiBox({ title, children, right }) {
      const [hover, setHover] = useState(false);
      return (
        <div
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          style={{
            border: `1px solid ${hover ? "#3a5a48" : "#1f2a24"}`,
            background: hover ? "#121a15" : "#0f1411",
            transition: "border-color 150ms, background 150ms",
          }}>
          <div style={{
            display: "flex", justifyContent: "space-between",
            padding: "6px 10px",
            borderBottom: "1px solid #1f2a24",
            color: "#7a8c80",
            fontSize: 11,
            letterSpacing: "0.05em",
            textTransform: "uppercase",
          }}>
            <span>{title}</span>
            {right && <span>{right}</span>}
          </div>
          <div style={{ padding: "12px 14px" }}>{children}</div>
        </div>
      );
    }

    // ---------- interactive roster hero -----------------------------------

    const INITIAL_AGENTS = [
      { id: "ceo",        status: "RUN",  activity: "dispatching blog-2",     provider: "claude-code", budget: 0.52, cap: 5, model: "sonnet-4.5",  skills: ["dispatch", "review"],  inbox: 2, tools: ["read", "write", "dispatch"], lastWake: "12s ago" },
      { id: "engineer",   status: "IDLE", activity: "—",                      provider: "codex",       budget: 1.80, cap: 5, model: "gpt-5",       skills: ["code", "test"],         inbox: 0, tools: ["read", "write", "shell"],     lastWake: "4m ago"  },
      { id: "researcher", status: "WARN", activity: "retry 2/3 · 12s",        provider: "gemini-cli",  budget: 0.12, cap: 3, model: "gemini-2.5",  skills: ["search", "summarize"],  inbox: 1, tools: ["read", "fetch"],              lastWake: "just now"},
      { id: "writer",     status: "RUN",  activity: "drafting post.md",       provider: "claude-code", budget: 0.34, cap: 3, model: "sonnet-4.5",  skills: ["write", "edit"],        inbox: 0, tools: ["read", "write"],              lastWake: "30s ago" },
      { id: "ops",        status: "IDLE", activity: "—",                      provider: "openai",      budget: 0.00, cap: 2, model: "gpt-5-mini",  skills: ["deploy", "monitor"],    inbox: 0, tools: ["shell", "read"],              lastWake: "1h ago"  },
    ];

    const STATUS_COLOR = { RUN: "#8ddc90", IDLE: "#7a8c80", WARN: "#e0b97a" };

    function RosterHero({ selected, onSelect }) {
      const [agents, setAgents] = useState(INITIAL_AGENTS);

      useEffect(() => {
        const id = setInterval(() => {
          setAgents((prev) => prev.map((a) => {
            if (a.status === "RUN") {
              const next = Math.min(a.cap, +(a.budget + Math.random() * 0.04).toFixed(2));
              return { ...a, budget: next };
            }
            return a;
          }));
        }, 1200);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        const id = setInterval(() => {
          setAgents((prev) => prev.map((a) => {
            if (a.id === "researcher" && a.status === "WARN" && Math.random() > 0.6) {
              return { ...a, status: "RUN", activity: "summarizing 12 sources" };
            }
            if (a.id === "engineer" && a.status === "IDLE" && Math.random() > 0.7) {
              return { ...a, status: "RUN", activity: "patching auth.ex" };
            }
            if (a.id === "engineer" && a.status === "RUN" && Math.random() > 0.85) {
              return { ...a, status: "IDLE", activity: "—" };
            }
            return a;
          }));
        }, 3500);
        return () => clearInterval(id);
      }, []);

      const activeCount = agents.filter((a) => a.status === "RUN").length;

      return (
        <div style={{
          background: "#0a0d0b",
          border: "1px solid #2a3a32",
          fontFamily: '"JetBrains Mono", ui-monospace, Menlo, monospace',
          fontSize: 12,
          lineHeight: 1.6,
          color: "#c9d9cd",
        }}>
          <div style={{
            display: "flex", alignItems: "center", gap: 8,
            borderBottom: "1px solid #1f2a24",
            padding: "8px 12px",
            background: "#0f1411",
          }}>
            <span style={{ color: "#7adccf", fontSize: 11.5 }}>▚ company/acme</span>
            <span style={{ color: "#4a5a50", marginLeft: 10, fontSize: 11.5 }}>· overview</span>
            <span style={{ marginLeft: "auto", color: "#4a5a50", fontSize: 11.5 }}>live · v0.10.0</span>
          </div>

          <div style={{ padding: "16px 18px 18px" }}>
            <div style={{
              color: "#7a8c80",
              display: "grid",
              gridTemplateColumns: "72px 100px 1fr 110px 130px",
              paddingBottom: 8,
              borderBottom: "1px solid #1f2a24",
              textTransform: "uppercase",
              letterSpacing: "0.06em",
              fontSize: 10.5,
            }}>
              <span>status</span><span>agent</span><span>activity</span><span>provider</span><span>budget</span>
            </div>
            {agents.map((r) => {
              const isSelected = selected === r.id;
              return (
                <div
                  key={r.id}
                  onClick={() => onSelect(isSelected ? null : r.id)}
                  style={{
                    display: "grid",
                    gridTemplateColumns: "72px 100px 1fr 110px 130px",
                    padding: "7px 8px 7px 6px",
                    margin: "1px -6px",
                    cursor: "pointer",
                    background: isSelected ? "#15241b" : "transparent",
                    borderLeft: isSelected ? "2px solid #8ddc90" : "2px solid transparent",
                    transition: "background 120ms",
                  }}
                  onMouseEnter={(e) => { if (!isSelected) e.currentTarget.style.background = "#0f1411"; }}
                  onMouseLeave={(e) => { if (!isSelected) e.currentTarget.style.background = "transparent"; }}
                >
                  <span style={{ color: STATUS_COLOR[r.status] }}>● {r.status}</span>
                  <span>{r.id}</span>
                  <span style={{ color: "#c9d9cd" }}>{r.activity}</span>
                  <span style={{ color: "#7adccf" }}>{r.provider}</span>
                  <span style={{ color: "#7a8c80" }}>${r.budget.toFixed(2)} / ${r.cap}</span>
                </div>
              );
            })}

            <div style={{
              borderTop: "1px solid #1f2a24",
              marginTop: 12,
              paddingTop: 10,
              display: "flex",
              justifyContent: "space-between",
              color: "#4a5a50",
              fontSize: 10.5,
              textTransform: "uppercase",
              letterSpacing: "0.06em",
            }}>
              <span>{selected ? `→ ${selected} selected · see drawer` : "click an agent to inspect"}</span>
              <span>{agents.length} agents · {activeCount} active</span>
            </div>
          </div>
        </div>
      );
    }

    // ---------- agent drawer ---------------------------------------------

    function AgentDrawer({ agentId, onClose }) {
      const agent = INITIAL_AGENTS.find((a) => a.id === agentId);
      const [dispatch, setDispatch] = useState("");
      const [sent, setSent] = useState(false);

      useEffect(() => { setSent(false); setDispatch(""); }, [agentId]);

      if (!agent) return null;

      const handleSend = () => {
        if (!dispatch.trim()) return;
        setSent(true);
        setTimeout(() => setSent(false), 2400);
        setDispatch("");
      };

      return (
        <div style={{
          position: "fixed",
          top: 0, right: 0, bottom: 0,
          width: 420,
          maxWidth: "100vw",
          background: "#0a0d0b",
          borderLeft: "1px solid #2a3a32",
          boxShadow: "-18px 0 44px rgba(0,0,0,0.55)",
          zIndex: 50,
          color: "#c9d9cd",
          fontFamily: '"JetBrains Mono", ui-monospace, Menlo, monospace',
          fontSize: 12,
          overflowY: "auto",
          animation: "drawer-in 220ms ease-out",
        }}>
          <style>{`@keyframes drawer-in { from { transform: translateX(12px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }`}</style>

          <div style={{
            display: "flex", alignItems: "center",
            padding: "12px 16px",
            borderBottom: "1px solid #1f2a24",
            background: "#0f1411",
          }}>
            <span style={{ color: STATUS_COLOR[agent.status] }}>● {agent.status}</span>
            <span style={{ marginLeft: 10, color: "#c9d9cd", fontSize: 14 }}>agents/{agent.id}</span>
            <button
              onClick={onClose}
              style={{
                marginLeft: "auto",
                background: "transparent",
                border: "1px solid #2a3a32",
                color: "#7a8c80",
                fontFamily: "inherit",
                fontSize: 11,
                padding: "3px 9px",
                cursor: "pointer",
              }}>esc · close</button>
          </div>

          <div style={{ padding: "18px 18px 10px", color: "#7a8c80", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em" }}>
            ── identity
          </div>
          <div style={{ padding: "0 18px 18px", display: "grid", gridTemplateColumns: "90px 1fr", gap: "6px 14px", fontSize: 12 }}>
            <span style={{ color: "#7a8c80" }}>provider</span><span style={{ color: "#7adccf" }}>{agent.provider}</span>
            <span style={{ color: "#7a8c80" }}>model</span><span>{agent.model}</span>
            <span style={{ color: "#7a8c80" }}>inbox</span><span>{agent.inbox} messages</span>
            <span style={{ color: "#7a8c80" }}>last wake</span><span style={{ color: "#c9d9cd" }}>{agent.lastWake}</span>
            <span style={{ color: "#7a8c80" }}>tools</span><span>{agent.tools.join(" · ")}</span>
            <span style={{ color: "#7a8c80" }}>skills</span><span>{agent.skills.join(" · ")}</span>
          </div>

          <div style={{ padding: "0 18px 10px", color: "#7a8c80", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em" }}>
            ── budget
          </div>
          <div style={{ padding: "0 18px 18px" }}>
            <div style={{ height: 6, background: "#1f2a24", position: "relative" }}>
              <div style={{
                position: "absolute", top: 0, left: 0, bottom: 0,
                width: `${Math.min(100, (agent.budget / agent.cap) * 100)}%`,
                background: agent.status === "WARN" ? "#e0b97a" : "#8ddc90",
                transition: "width 400ms",
              }} />
            </div>
            <div style={{ marginTop: 8, display: "flex", justifyContent: "space-between", color: "#7a8c80", fontSize: 11 }}>
              <span>${agent.budget.toFixed(2)} spent this month</span>
              <span>cap ${agent.cap.toFixed(2)}</span>
            </div>
          </div>

          <div style={{ padding: "0 18px 10px", color: "#7a8c80", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em" }}>
            ── dispatch
          </div>
          <div style={{ padding: "0 18px 22px" }}>
            <textarea
              value={dispatch}
              onChange={(e) => setDispatch(e.target.value)}
              placeholder={`message @${agent.id}…`}
              rows={3}
              style={{
                width: "100%",
                background: "#0f1411",
                border: "1px solid #2a3a32",
                color: "#c9d9cd",
                fontFamily: "inherit",
                fontSize: 12,
                padding: "10px 12px",
                resize: "none",
                outline: "none",
                boxSizing: "border-box",
              }}
              onFocus={(e) => e.target.style.borderColor = "#3a5a48"}
              onBlur={(e) => e.target.style.borderColor = "#2a3a32"}
            />
            <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
              <button
                onClick={handleSend}
                disabled={!dispatch.trim()}
                style={{
                  background: dispatch.trim() ? "#8ddc90" : "#1f2a24",
                  color: dispatch.trim() ? "#0a0d0b" : "#4a5a50",
                  border: "none",
                  padding: "7px 14px",
                  fontFamily: "inherit",
                  fontSize: 12,
                  fontWeight: 500,
                  cursor: dispatch.trim() ? "pointer" : "not-allowed",
                }}>
                ▸ dispatch
              </button>
              <span style={{ color: "#4a5a50", fontSize: 11 }}>⇧⏎ to send</span>
              {sent && <span style={{ color: "#8ddc90", fontSize: 11, marginLeft: "auto" }}>✓ queued</span>}
            </div>
          </div>

          <div style={{ padding: "0 18px 10px", color: "#7a8c80", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em" }}>
            ── recent audit
          </div>
          <div style={{ padding: "0 18px 28px", fontSize: 11, color: "#7a8c80", lineHeight: 1.85 }}>
            {[
              { t: "14:22:08", c: "#8ddc90", a: "wake",   d: "inbox/task-001.md" },
              { t: "14:22:11", c: "#7adccf", a: "tool",   d: "read(main.ex)" },
              { t: "14:22:14", c: "#7adccf", a: "tool",   d: "write(reply.md)" },
              { t: "14:22:20", c: "#8ddc90", a: "exit",   d: "ok · 12.4s · $0.04" },
            ].map((e, i) => (
              <div key={i}>
                <span style={{ color: "#4a5a50" }}>{e.t}</span>
                <span style={{ color: e.c, marginLeft: 10 }}>{e.a.padEnd(6)}</span>
                <span style={{ color: "#c9d9cd", marginLeft: 4 }}>{e.d}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- copy-to-clipboard helper ---------------------------------

    function CopyBlock({ lines }) {
      const [copied, setCopied] = useState(false);
      const text = lines.join("\n");

      const handleCopy = (e) => {
        e.stopPropagation();
        try { navigator.clipboard.writeText(text); } catch (_) {}
        setCopied(true);
        setTimeout(() => setCopied(false), 1400);
      };

      return (
        <div style={{ position: "relative" }}>
          <button
            onClick={handleCopy}
            style={{
              position: "absolute", top: 8, right: 8,
              background: copied ? "#8ddc90" : "#1f2a24",
              color: copied ? "#0a0d0b" : "#c9d9cd",
              border: "none",
              padding: "3px 9px",
              fontSize: 10.5,
              fontFamily: "inherit",
              letterSpacing: "0.06em",
              textTransform: "uppercase",
              cursor: "pointer",
            }}>
            {copied ? "✓ copied" : "copy"}
          </button>
          <div>
            {lines.map((l, i) => (
              <div key={i} style={{ wordBreak: "break-all" }}>
                <span style={{ color: "#8ddc90" }}>$</span> {l.replace(/^\$\s*/, "")}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- install section with tabs --------------------------------

    const INSTALL_TABS = [
      {
        id: "brew",
        label: "homebrew",
        subtitle: "linux + macOS",
        lines: ["brew tap foobarto/tap", "brew install glorbo", "glorbo init"],
        after: <>→ dashboard at <span style={{ color: "#7adccf" }}>http://127.0.0.1:4000</span> · linux x86_64 / aarch64 · macOS intel + apple silicon (Burrito-bundled BEAM, FSEvents watcher; agents run unsandboxed since bwrap is linux-only)</>,
      },
      {
        id: "curl",
        label: "curl",
        subtitle: "linux x86_64 · aarch64",
        lines: [
          "curl -L github.com/foobarto/glorbo/releases/latest/download/glorbo-linux-$(uname -m) -o ~/.local/bin/glorbo",
          "chmod +x ~/.local/bin/glorbo",
          "glorbo init",
        ],
        after: "prereqs: bubblewrap · passt (for network: proxy) · inotify-tools · one provider CLI on $PATH or a native credentials file",
      },
      {
        id: "wsl",
        label: "windows · wsl2",
        subtitle: "wsl2 ubuntu / debian",
        lines: [
          "wsl --install              # in PowerShell, once",
          "curl -L github.com/foobarto/glorbo/releases/latest/download/glorbo-linux-x86_64 -o ~/.local/bin/glorbo",
          "chmod +x ~/.local/bin/glorbo && glorbo init",
        ],
        after: <><span style={{ color: "#e0b97a" }}>note:</span> no native windows port planned — bwrap, inotify, and unprivileged user namespaces are linux-only</>,
      },
      {
        id: "source",
        label: "from source",
        subtitle: "elixir 1.18.4 · otp-28",
        lines: [
          "git clone github.com/foobarto/glorbo && cd glorbo",
          "mix setup            # deps + db + esbuild",
          "mix phx.server       # dashboard on :4000",
        ],
        after: "mix precommit runs format + compile-warn + credo --strict + tests",
      },
    ];

    function InstallTabs() {
      const [active, setActive] = useState("brew");
      const tab = INSTALL_TABS.find((t) => t.id === active);

      return (
        <div style={{ border: "1px solid #2a3a32", background: "#0f1411" }}>
          <div style={{ display: "flex", borderBottom: "1px solid #1f2a24", flexWrap: "wrap" }}>
            {INSTALL_TABS.map((t) => (
              <button
                key={t.id}
                onClick={() => setActive(t.id)}
                style={{
                  flex: "1 0 140px",
                  background: active === t.id ? "#0a0d0b" : "transparent",
                  color: active === t.id ? "#c9d9cd" : "#7a8c80",
                  border: "none",
                  borderRight: "1px solid #1f2a24",
                  borderBottom: active === t.id ? "2px solid #8ddc90" : "2px solid transparent",
                  padding: "12px 16px",
                  fontFamily: "inherit",
                  fontSize: 12,
                  letterSpacing: "0.04em",
                  cursor: "pointer",
                  textAlign: "left",
                }}>
                <div>{t.label}</div>
                <div style={{ fontSize: 10, color: "#4a5a50", marginTop: 2, textTransform: "lowercase" }}>{t.subtitle}</div>
              </button>
            ))}
          </div>

          <div style={{ padding: "22px 24px", fontSize: 13, color: "#c9d9cd" }}>
            <CopyBlock lines={tab.lines} />
            <div style={{ color: "#7a8c80", marginTop: 14, fontSize: 11.5, lineHeight: 1.6 }}>{tab.after}</div>
          </div>
        </div>
      );
    }

    // ---------- how-it-works stepper -------------------------------------

    const WAKE_STEPS = [
      { id: 1, title: "director writes", color: "#c69ae0", body: "→ agents/ceo/inbox/task-001.md", detail: "A file appears in the agent's inbox. That's the trigger. No API, no queue broker — just inotify (or FSEvents on macOS) watching the directory." },
      { id: 2, title: "router checks",   color: "#8ddc90", body: "Company.Router composes prompt · permissions", detail: "Permissions are read from the agent's AGENT.md. The prompt is assembled from AGENT.md + SOUL.md + heartbeat / inbox context." },
      { id: 3, title: "bwrap sandbox",   color: "#e0b97a", body: "--die-with-parent --unshare-net --cap-drop ALL", detail: "Kernel-level isolation. Denied paths aren't mounted. Credentials bound read-only. No net, no caps, no escape." },
      { id: 4, title: "CLI or harness",  color: "#7adccf", body: "claude -p · gemini -p · codex exec - · glorbo harness",  detail: "The agent's chosen CLI (or, for native providers, the built-in glorbo harness) reads the prompt on stdin and writes the answer to $GLORBO_REPLY_PATH." },
      { id: 5, title: "elixir routes",   color: "#7adccf", body: "audit jsonl · outbox → inbox/channels", detail: "Reply is parsed for tool calls, costs, and routed messages. Audit log appended. SQLite index updated. Dashboard repaints." },
    ];

    function WakeStepper() {
      const [active, setActive] = useState(1);
      const [auto, setAuto] = useState(true);

      useEffect(() => {
        if (!auto) return;
        const id = setInterval(() => {
          setActive((a) => (a % WAKE_STEPS.length) + 1);
        }, 2600);
        return () => clearInterval(id);
      }, [auto]);

      const step = WAKE_STEPS.find((s) => s.id === active);

      return (
        <div style={{
          background: "#0f1411",
          border: "1px solid #1f2a24",
          padding: "22px 26px",
        }}>
          <div style={{ display: "flex", gap: 2, marginBottom: 22, flexWrap: "wrap" }}>
            {WAKE_STEPS.map((s) => (
              <button
                key={s.id}
                onClick={() => { setActive(s.id); setAuto(false); }}
                style={{
                  flex: "1 0 140px",
                  background: active === s.id ? "#15241b" : "transparent",
                  border: "1px solid",
                  borderColor: active === s.id ? s.color : "#1f2a24",
                  color: active === s.id ? s.color : "#7a8c80",
                  padding: "10px 12px",
                  fontFamily: "inherit",
                  fontSize: 11.5,
                  cursor: "pointer",
                  textAlign: "left",
                  transition: "border-color 150ms, background 150ms",
                }}>
                <div style={{ fontSize: 10, color: "#4a5a50", marginBottom: 4 }}>step {s.id}</div>
                <div>{s.title}</div>
              </button>
            ))}
          </div>

          <div style={{ color: step.color, fontSize: 13, marginBottom: 8, fontFamily: "inherit", wordBreak: "break-word" }}>
            ◆ {step.body}
          </div>
          <div style={{ color: "#c9d9cd", fontSize: 13, lineHeight: 1.6, maxWidth: 680 }}>
            {step.detail}
          </div>

          <div style={{ marginTop: 18, display: "flex", gap: 14, color: "#4a5a50", fontSize: 11, alignItems: "center" }}>
            <button
              onClick={() => setAuto(!auto)}
              style={{
                background: "transparent",
                border: "1px solid #2a3a32",

    function Nav({ rootRef }) {
      const [active, setActive] = useState("top");

      useEffect(() => {
        const root = rootRef?.current;
        if (!root) return;
        const ids = ["features", "how", "screens", "install"];
        const onScroll = () => {
          const y = window.scrollY || document.documentElement.scrollTop || 0;
          let cur = "top";
          ids.forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const top = el.getBoundingClientRect().top + y - 60;
            if (y >= top) cur = id;
          });
          setActive(cur);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, [rootRef]);

      const go = (id) => (e) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      const link = (id, label) => (
        <a
          href={`#${id}`}
          onClick={go(id)}
          style={{
            color: active === id ? "#c9d9cd" : "#7a8c80",

                  a private netns via <span style={{ color: "#c9d9cd" }}>pasta</span> — only the per-company
                  proxy port is reachable. <span style={{ color: "#c9d9cd" }}>ls -la</span> is your audit tool.
                </div>
                <div style={{ color: "#4a5a50", fontSize: 11.5, wordBreak: "break-word" }}>
                  <span style={{ color: "#8ddc90" }}>◆</span> --unshare-user-try --unshare-ipc --unshare-pid --unshare-uts --cap-drop ALL
                </div>
              </TuiBox>

              <TuiBox title="cli + native agents" right="gep-32">
                <div style={{ marginBottom: 10, fontSize: 13, color: "#c9d9cd" }}>
                  Your existing CLIs. Or native endpoints. Both sandboxed.
                </div>
                <div style={{ color: "#7a8c80", fontSize: 12, marginBottom: 14, lineHeight: 1.6 }}>
                  Glorbo wraps <span style={{ color: "#c9d9cd" }}>claude</span>,
                  <span style={{ color: "#c9d9cd" }}> gemini</span>,
                  <span style={{ color: "#c9d9cd" }}> codex</span>,
                  <span style={{ color: "#c9d9cd" }}> opencode</span>,
                  <span style={{ color: "#c9d9cd" }}> hermes</span>,
                  <span style={{ color: "#c9d9cd" }}> pi</span>,
                  {" "}plus native <span style={{ color: "#c9d9cd" }}>openai</span> / <span style={{ color: "#c9d9cd" }}>openrouter</span>
                  {" "}endpoints and auto-detected local servers (Ollama, LM Studio, vLLM, LocalAI, llama.cpp).
                  Credentials stay on the host. No SDK layer.
                </div>
                <div style={{ color: "#4a5a50", fontSize: 11.5, wordBreak: "break-word" }}>
                  <span style={{ color: "#7adccf" }}>◆</span> glorbo detect-providers · ~/.local/etc/glorbo/credentials/openai.toml
                </div>
              </TuiBox>

              <TuiBox title="otp supervision" right="crash ≠ outage">
                <div style={{ marginBottom: 10, fontSize: 13, color: "#c9d9cd" }}>
                  If an agent crashes, only that agent restarts.
                </div>
                <div style={{ color: "#7a8c80", fontSize: 12, marginBottom: 14, lineHeight: 1.6 }}>
                  One supervision tree per company. The dashboard, other companies,
                  and sibling agents keep going. That's just what the BEAM does.
                </div>
                <div style={{ color: "#4a5a50", fontSize: 11.5, wordBreak: "break-word" }}>
                  <span style={{ color: "#c69ae0" }}>◆</span> Application → CompanySupervisor → Company.Supervisor(acme) → Agent.Server(ceo)
                </div>
              </TuiBox>
            </div>
          </div>

            <p style={{ color: "#7a8c80", margin: 0, marginBottom: 28, fontSize: 13, maxWidth: 620 }}>

            <h2 style={{ fontSize: 28, margin: 0, marginBottom: 10, fontWeight: 500, letterSpacing: "-0.01em" }}>

            <div style={{ color: "#4a5a50", fontSize: 11.5, marginTop: 14, lineHeight: 1.7 }}>

              {" "}<span style={{ color: "#c9d9cd" }}>passt</span> (for <span style={{ color: "#c9d9cd" }}>network: proxy</span>),
              {" "}and <span style={{ color: "#c9d9cd" }}>inotify-tools</span>. A provider CLI on PATH
              (<span style={{ color: "#c9d9cd" }}>claude</span>, <span style={{ color: "#c9d9cd" }}>gemini</span>, <span style={{ color: "#c9d9cd" }}>codex</span>, …)
              {" "}or a native credentials file. macOS works without bwrap (agents run unsandboxed; one audit row per boot).
              No Python. No Erlang. No Node.js.
            </div>
          </div>

          <div style={{
            border: "1px solid #1f2a24",
