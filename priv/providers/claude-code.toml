# Claude Code CLI — bundled default provider (GEP-8).
#
# Verified against Claude Code 2.1.110 on 2026-04-16. Session JSONL
# shape matches the live probe from pre-pivot research.

name   = "claude-code"
binary = "claude"

args = [
  "--print",
  "--model", "{model}",
  "--output-format", "text",
]
prompt_mode = "stdin"

# Reply contract (GEP-8 §7.4). Agent writes final prose to $GLORBO_REPLY_PATH.
reply_dir               = "{workspace}/.glorbo/outbox"
reply_filename_template = "{timestamp}-{invocation_id}.md"
reply_max_bytes         = 1_048_576

# Version probing (opted-in by default for built-ins — GEP-8 D13).
version_flag        = "--version"
version_regex       = '(\d+\.\d+\.\d+)'
allow_version_probe = true

# Usage parsing — session JSONL under the agent's CLAUDE_CONFIG_DIR.
usage_parser = "claude_jsonl"
usage_path   = { kind = "jsonl_latest_in_dir", path = "{workspace}/.glorbo-claude/projects/{encoded_workspace}" }

# No CLAUDE_CONFIG_DIR — let claude-code use its default
# `$HOME/.claude/` + `$HOME/.claude.json` layout. The sandbox's HOME
# is /workspace (set by Bwrap), so claude-code looks at
# `/workspace/.claude/` and `/workspace/.claude.json`, both of which
# we bind below from the Director's real home.
[env]

# Claude encodes the workspace path into a single directory name by
# replacing every `/` with `-`. See PathTransforms.slash_to_dash/1.
[path_transforms.encoded_workspace]
from      = "{workspace}"
transform = "slash_to_dash"

# Auth binds (GEP-8 auth_binds). claude-code expects both:
#
#   - `$HOME/.claude/` — OAuth refresh token (.credentials.json),
#     session history (history.jsonl), plugins, etc.
#   - `$HOME/.claude.json` — session config file at home root.
#
# The two are sibling paths in the same HOME. Neither bind overlays
# the other, so bwrap's no-create-in-ro constraint doesn't bite.
[[auth_binds]]
host    = "~/.claude"
sandbox = "/workspace/.claude"
mode    = "ro"

[[auth_binds]]
host    = "~/.claude.json"
sandbox = "/workspace/.claude.json"
mode    = "ro"
