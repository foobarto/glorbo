# Stado — bundled provider via ACP transport (GEP-45).
#
# Stado (foobarto/stado) is a complete standalone agent runtime: it
# calls its own configured model (anthropic / openai / google / groq /
# ollama-cloud / any OAI-compat preset), uses its own bundled tools
# (webfetch, ripgrep, ast-grep, lsp, fs, bash), and emits its own
# audit trace into a per-session git ref. Glorbo dispatches via ACP
# (Agent Client Protocol — JSON-RPC 2.0 over stdio per Zed's spec),
# which stado already exposes as `stado acp`.
#
# `prompt_mode = "acp"` opts into the GEP-45 Phase 1b dispatcher
# branch (`Glorbo.CLI.Dispatcher.Acp`) — the JSON-RPC client that
# does initialize → session/new → session/prompt → drain
# session/update chunks → write reply file → shutdown. Phase 1a
# (this file) ships the registry entry; Phase 1b implements the
# dispatcher branch.

name   = "stado"
binary = "stado"

# `--tools` opens stado's full audited executor loop. Glorbo's bwrap
# sandbox is the outer permission boundary so giving stado its full
# tool set inside the sandbox is safe by construction (same posture
# as `claude-code --permission-mode bypassPermissions` in the
# claude-code provider TOML).
args        = ["acp", "--tools"]
prompt_mode = "acp"

# Reply contract (GEP-8 §7.4) — same as stdin-prompt providers.
# The ACP dispatcher branch assembles streamed `session/update`
# chunks into the reply buffer and writes once at the end; downstream
# code (audit log, reply rendering, agent state machine) sees no
# difference.
reply_dir               = "{workspace}/.glorbo/outbox"
reply_filename_template = "{timestamp}-{invocation_id}.md"
reply_max_bytes         = 1_048_576

# Version probing (opted-in by default for built-ins per GEP-8 D13).
version_flag        = "--version"
version_regex       = '(\d+\.\d+\.\d+)'
allow_version_probe = true

# Usage parser (GEP-45 Phase 3). After each ACP dispatch the
# Dispatcher invokes `stado stats --session <sessionId> --json`
# INSIDE the bwrap sandbox (same XDG env as the dispatch), reading
# stado's session JSONL trace from the per-agent sandbox-local
# `XDG_DATA_HOME` under `/workspace/.local/share/stado`. The parser
# maps the JSON to glorbo's canonical `Parsers.usage()` shape,
# extending it with `cost_usd` + `duration_ms` so the budget ledger
# can attribute spend per dispatch.
#
# Requires stado >= 0.27.x for the `stado stats --json` flag. Older
# stadothats fall back to the human table — the parser flags this
# as `{:invalid_json, _}` and the dispatcher records `usage: nil`.
usage_parser = "stado_acp"

# Relocate stado's data + state INTO the per-agent sandbox workspace
# (A-001 / B-006 / B-023 / B-026). Stado follows XDG, so pointing
# XDG_DATA_HOME + XDG_STATE_HOME at `/workspace/.local/{share,state}`
# moves stado's session JSONL audit refs and per-session git worktrees
# into the agent-private, per-company, rw workspace mount — they never
# touch shared host state, so there is no cross-company read/write
# breach and no rw host bind. XDG_CONFIG_HOME stays pointed at the
# RO-bound `/workspace/.config` (operator config / model selection,
# like other providers' creds).
#
# `{workspace}` expands to the HOST workspace path; the ACP dispatch
# branch rewrites host-workspace → `/workspace` before the env reaches
# the sandbox (mirrors codex-acp's CODEX_HOME pattern), so the CLI
# sees the sandbox paths below.
[env]
XDG_CONFIG_HOME = "{workspace}/.config"
XDG_DATA_HOME   = "{workspace}/.local/share"
XDG_STATE_HOME  = "{workspace}/.local/state"

# Stado's config is the only thing it reads from the host: provider /
# model selection, inference presets, custom tools. Read-only, mounted
# under XDG_CONFIG_HOME (like other providers' credentials). Stado's
# DATA + STATE dirs are NOT bound — they live inside the workspace via
# the XDG env above, so session resume (F6) and worktree creation work
# per-agent without sharing host state across companies.
[[auth_binds]]
host    = "~/.config/stado"
sandbox = "/workspace/.config/stado"
mode    = "ro"

# Broker-style providers like stado don't expose an HTTP /models
# endpoint — they pick a backend (anthropic / openai / ollama / etc.)
# at runtime based on `defaults.provider` in `~/.config/stado/config.toml`.
# Declaring a static list lets `Glorbo.Providers.ModelCatalog` populate
# the LV agent-wizard combobox + KanbanLive new-task model picker
# without an HTTP probe (GEP-32 ↔ GEP-45 wiring).
#
# Operators who want a different default set can drop a user override
# at `~/.glorbo/providers/stado.toml` with their own `model_list.models`
# list — GEP-8 already supports this override pattern.
#
# `auto` first because that's stado's recommended setting (delegate
# the model pick to whatever local runner / cloud preset is currently
# active). The other entries are well-known aliases stado understands
# across its supported backends.
[model_list]
shape  = "static"
models = [
  "auto",
  "claude-sonnet-4-5",
  "claude-haiku-4-5",
  "claude-opus-4-7",
  "gpt-5",
  "gpt-5-mini",
  "gpt-oss-120b",
  "gemini-2.5-pro",
  "gemini-2.5-flash",
  "qwen3-32b",
  "qwen3-coder-30b",
  "gemma3-27b",
  "deepseek-r1-32b"
]
