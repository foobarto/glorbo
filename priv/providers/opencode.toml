# opencode CLI — untracked-by-default provider (GEP-8).
#
# opencode is an open-source Claude Code alternative. Invocation
# shape below is a starting point; no telemetry parser is bound —
# agents opting into opencode must set allow_untracked_budget: true
# in agent.md. Follow-up work can ship an opencode_jsonl parser if
# its session format stabilises.

name   = "opencode"
binary = "opencode"

# opencode's official installer (`curl -fsSL https://opencode.ai/install | bash`)
# drops the binary at `~/.opencode/bin/opencode` and does NOT add that
# directory to `$PATH` unless the user sources it in their shell rc.
# Declaring the install path here lets Detection find the binary even
# when it's not on `$PATH`. See GEP-16 §4 for the sibling mechanism
# (`cli_binary_binds`) that mounts the found path into the sandbox.
fallback_paths = ["~/.opencode/bin/opencode"]

# `opencode run` takes the subcommand as the first positional arg.
# `-m <provider/model>` routes to any configured opencode provider
# (including `lmstudio/...` which points at a local LM Studio server).
# `--format json` is omitted so the Dispatcher's stdout-as-reply
# fallback sees a human-readable answer when no reply file is written
# (opencode's untracked path; GEP-8 D15).
args = [
  "run",
  "-m", "{model}",
  # Glorbo is the outer permission boundary: bwrap mount namespaces +
  # ACLMapper already gate every FS access at the kernel. Opencode
  # has its own policy layer that prompts on writes to directories
  # outside `/workspace` — which bites in Glorbo's sandbox because
  # `/outbox`, `/inbox`, and `/workspace/.glorbo-skills` are siblings
  # not children. Under `--print`-style non-interactive mode every
  # prompt auto-rejects, causing permission denials on legit writes.
  # Flip to auto-approve so the kernel layer stays authoritative.
  "--dangerously-skip-permissions",
]
prompt_mode = "stdin"

reply_dir               = "{workspace}/.glorbo/outbox"
reply_filename_template = "{timestamp}-{invocation_id}.md"
reply_max_bytes         = 1_048_576

version_flag        = "--version"
version_regex       = '(\d+\.\d+\.\d+)'
allow_version_probe = true

usage_parser = "none"

# Sandbox HOME is /workspace (see Bwrap.build_argv). opencode reads
# its provider definitions from $HOME/.config/opencode/opencode.json —
# the Director's real `~/.config/opencode/` is ro-mounted there so the
# agent inherits the same `lmstudio`, `ollama`, etc. provider list
# the user configured. State (sqlite db, session cache) is left to
# opencode to create fresh under `$XDG_DATA_HOME`, pointed at a
# workspace-local dir so the sandbox can write without touching the
# Director's real `~/.local/share/opencode/`.
[env]
XDG_DATA_HOME = "{workspace}/.opencode-data"

[[auth_binds]]
host    = "~/.config/opencode"
sandbox = "/workspace/.config/opencode"
mode    = "ro"
