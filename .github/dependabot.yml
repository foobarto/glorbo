# Dependabot — automated dependency-update PRs (OpenSSF hardening track).
#
# Two ecosystems:
#   - mix             : Elixir/Hex deps in mix.exs / mix.lock
#   - github-actions  : pinned action SHAs in .github/workflows/*
#
# All third-party actions in this repo are pinned to a full commit SHA
# with a `# vX.Y.Z` comment. Dependabot understands SHA-pinned actions
# and will bump both the SHA and the trailing version comment.
version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      # Bundle low-risk hex bumps into one PR to cut review noise.
      # MAJOR bumps are intentionally NOT grouped — they land as
      # individual PRs so each gets scrutiny (breaking-change risk).
      hex-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      # Group ALL action bumps (incl. majors) into one PR so the
      # upload-artifact / download-artifact majors — which must move
      # together to keep the build→release artifact format compatible —
      # are reviewed and merged as a single unit, never split.
      github-actions:
        patterns:
          - "*"
